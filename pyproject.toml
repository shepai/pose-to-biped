[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "G1-pose-to-biped"
version = "0.1.0"
description = "G1 control and body copying"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Dexter Shepherd"}
]
dependencies = [
    "numpy>=2.0",
    "torch>=2.7",
    "opencv-python>=4.10",
    "mujoco",
    "gymnasium",
    "tqdm",
    "rich"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]